[workspace]
resolver = "2"
members = [
    "crates/synapse-core",
    "crates/synapse-store",
    "crates/synapse-auth",
    "crates/synapse-api",
    "crates/synapse-git",
    "crates/synapse-radicle",
    "crates/synapse-bench",
    "crates/synapse-crumb",
    "crates/synapse-coord",
    "crates/synapse-evidence",
    "crates/synapse-wire",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Drake Stapleton <aien@aienos.com>"]
repository = "https://github.com/aien-spark/synapse"

[workspace.dependencies]
base64 = "0.22"
# J3 edge-case vectors (mixed-order and non-canonical points); already in the graph via ed25519-dalek.
curve25519-dalek = { version = "4.1", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
# `asm` compiles the aarch64 SHA-2 instruction backend (run-time detected, portable
# fallback) into sha2 0.10; without it aarch64 always uses the software backend (J3).
sha2 = { version = "0.10", features = ["asm"] }
synapse-api = { path = "crates/synapse-api" }
synapse-auth = { path = "crates/synapse-auth" }
synapse-bench = { path = "crates/synapse-bench" }
synapse-coord = { path = "crates/synapse-coord" }
synapse-core = { path = "crates/synapse-core" }
synapse-crumb = { path = "crates/synapse-crumb" }
synapse-evidence = { path = "crates/synapse-evidence" }
synapse-git = { path = "crates/synapse-git" }
synapse-radicle = { path = "crates/synapse-radicle" }
synapse-store = { path = "crates/synapse-store" }
synapse-wire = { path = "crates/synapse-wire" }
zeroize = "1.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
