name: Synapse portable CI
on:
  # Retired from pull requests and pushes on 2026-10-16 (ADR 0033 Decision 11, phase 3): the Spark
  # runs these gates (tests/gates/) and the required AIEN Verification check verifies its signed
  # bundle. Kept as a manual trigger so a hosted run is still possible when needed.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: portable-${{ matrix.gate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [workspace, conformance]
    env:
      CARGO_TERM_COLOR: never
      CI_EVIDENCE_DIR: ${{ github.workspace }}/target/ci-evidence
      AIEN_ARCHITECTURE_REPO: ${{ github.workspace }}/.ci-architecture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.gate == 'conformance'
        with:
          repository: aien-spark/aien-architecture
          ref: 29780e56c9e6b9111d884e0d4b146737228c19f6
          path: .ci-architecture
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.1
      - name: Run required portable gate
        run: bash scripts/ci/portable.sh '${{ matrix.gate }}'
      - name: Archive diagnostic evidence (not a hardware receipt)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.gate }}-${{ github.sha }}
          path: target/ci-evidence/
          if-no-files-found: error
          retention-days: 14
